<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eaf4fc">
<title>تسجيل الحضور</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --blue:          #3498db;
    --blue-dark:     #2980b9;
    --blue-darker:   #1f6391;
    --ink:           #1b3a57;
    --muted:         #8a99a8;
    --card:          #ffffff;
    --field:         #f6f9fc;
    --border:        #e1e8ef;
    --success-bg:    #e8f8f0;
    --success-fg:    #1e7a52;
    --error-bg:      #fdecea;
    --error-fg:      #c0392b;
    --grad-top:      #dceefb;
    --grad-bottom:   #ffffff;
    --shadow:        0 18px 40px -18px rgba(27, 58, 87, .28);
    --radius:        16px;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --card:       #16202b;
      --field:      #1d2936;
      --border:     #2b3a49;
      --ink:        #eaf2f9;
      --muted:      #93a4b5;
      --grad-top:   #101820;
      --grad-bottom:#0b1117;
      --success-bg: #14332a;
      --success-fg: #7fd9ae;
      --error-bg:   #3a1d1c;
      --error-fg:   #f1948a;
      --shadow:     0 18px 40px -18px rgba(0, 0, 0, .6);
    }
  }
  :root[data-theme="dark"] {
    --card:       #16202b;
    --field:      #1d2936;
    --border:     #2b3a49;
    --ink:        #eaf2f9;
    --muted:      #93a4b5;
    --grad-top:   #101820;
    --grad-bottom:#0b1117;
    --success-bg: #14332a;
    --success-fg: #7fd9ae;
    --error-bg:   #3a1d1c;
    --error-fg:   #f1948a;
    --shadow:     0 18px 40px -18px rgba(0, 0, 0, .6);
  }

  *, *::before, *::after { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    padding: 24px 18px calc(24px + env(safe-area-inset-bottom));
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Cairo', 'Segoe UI', Tahoma, system-ui, sans-serif;
    background: var(--grad-bottom);
    background-image: linear-gradient(180deg, var(--grad-top) 0%, var(--grad-bottom) 62%);
    background-attachment: fixed;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  .card {
    width: 100%;
    max-width: 420px;
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 34px 26px 26px;
    text-align: center;
  }

  .logo {
    width: 62px;
    height: 62px;
    margin: 0 auto 18px;
    display: grid;
    place-items: center;
    font-size: 30px;
    line-height: 1;
    border-radius: 50%;
    background: linear-gradient(160deg, #eaf4fc, #d3e9f9);
    box-shadow: inset 0 0 0 1px rgba(52, 152, 219, .18);
  }

  h1 {
    margin: 0 0 6px;
    font-size: 25px;
    font-weight: 700;
    letter-spacing: -.01em;
    color: var(--ink);
  }

  .subtitle {
    margin: 0 0 26px;
    font-size: 14.5px;
    font-weight: 400;
    color: var(--muted);
  }

  .field-label {
    display: block;
    text-align: right;
    font-size: 13px;
    font-weight: 700;
    color: var(--ink);
    margin-bottom: 6px;
    margin-top: 14px;
  }

  .name-input,
  .destination-input {
    width: 100%;
    padding: 14px 16px;
    font-family: inherit;
    font-size: 16px;
    font-weight: 500;
    color: var(--ink);
    text-align: right;
    background: var(--field);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    outline: none;
    transition: border-color .18s ease, background-color .18s ease, box-shadow .18s ease;
  }
  .name-input::placeholder,
  .destination-input::placeholder { color: var(--muted); font-weight: 400; }

  .name-input:focus,
  .destination-input:focus {
    border-color: var(--blue);
    background: var(--card);
    box-shadow: 0 0 0 4px rgba(52, 152, 219, .14);
  }

  .name-input:disabled,
  .destination-input:disabled { opacity: .6; }

  .checkin-btn {
    width: 100%;
    margin-top: 20px;
    padding: 15px 18px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    font-family: inherit;
    font-size: 15.5px;
    font-weight: 700;
    color: #fff;
    background: var(--blue);
    border: none;
    border-radius: 12px;
    cursor: pointer;
    transition: background-color .18s ease, transform .1s ease, box-shadow .18s ease;
    box-shadow: 0 8px 18px -8px rgba(52, 152, 219, .85);
  }
  .checkin-btn:hover:not(:disabled) {
    background: var(--blue-dark);
    box-shadow: 0 10px 22px -8px rgba(41, 128, 185, .95);
  }
  .checkin-btn:active:not(:disabled) { transform: translateY(1px); }
  .checkin-btn:disabled {
    background: #a9c7dc;
    cursor: not-allowed;
    box-shadow: none;
  }
  .checkin-btn:focus-visible,
  .name-input:focus-visible,
  .destination-input:focus-visible {
    outline: 3px solid var(--blue-darker);
    outline-offset: 2px;
  }

  .spinner {
    width: 17px;
    height: 17px;
    border: 2.5px solid rgba(255, 255, 255, .45);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin .7s linear infinite;
    flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .status {
    margin-top: 16px;
    padding: 13px 15px;
    font-size: 14.5px;
    font-weight: 600;
    line-height: 1.6;
    border-radius: 12px;
    display: none;
  }
  .status.visible { display: block; }
  .status.success { background: var(--success-bg); color: var(--success-fg); }
  .status.error   { background: var(--error-bg);   color: var(--error-fg); }

  .footer-note {
    margin: 22px 0 0;
    font-size: 12px;
    font-weight: 400;
    line-height: 1.7;
    color: var(--muted);
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .01ms !important;
    }
  }

  @media (max-width: 360px) {
    .card { padding: 28px 20px 22px; }
    h1 { font-size: 22px; }
  }
</style>
</head>
<body>

  <main class="card">
    <div class="logo" aria-hidden="true">📍</div>

    <h1>تسجيل الحضور</h1>
    <p class="subtitle">سجل حضورك أو انصرافك بضغطة واحدة</p>

    <label class="field-label" for="nameInput">الاسم الكامل</label>
    <input
      id="nameInput"
      class="name-input"
      type="text"
      placeholder="اكتب اسمك الكامل"
      autocomplete="name"
      dir="rtl"
      enterkeyhint="next">

    <label class="field-label" for="destinationInput">الوجهة</label>
    <input
      id="destinationInput"
      class="destination-input"
      type="text"
      placeholder="مثال: مدينة نصر، المعادي، مدينة 6 أكتوبر..."
      autocomplete="off"
      dir="rtl"
      enterkeyhint="done">

    <button id="checkinBtn" class="checkin-btn" type="button">
      <span id="btnText">تسجيل حضور أو تسجيل انصراف</span>
    </button>

    <div id="statusBox" class="status" role="status" aria-live="polite"></div>

    <p class="footer-note">سيتم استخدام موقعك الجغرافي فقط لتسجيل الحضور</p>
  </main>

  <!-- Supabase JS client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
  (function () {
    'use strict';

    /* ============================================================
       CONFIG
       ============================================================ */
    const SUPABASE_URL = 'https://itahlydnrzembvbqbrdu.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml0YWhseWRucnplbWJ2YnFicmR1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk3NTc5NjEsImV4cCI6MjEwNTMzMzk2MX0.0ErheMPDk_6wbhv49hb3pCAHilmnaf_bcWEEPOYGNyc';

    const COOLDOWN_SECONDS = 60;

    /* ---------- DOM references ---------- */
    const nameInput = document.getElementById('nameInput');
    const destinationInput = document.getElementById('destinationInput');
    const checkinBtn = document.getElementById('checkinBtn');
    const btnText = document.getElementById('btnText');
    const statusBox = document.getElementById('statusBox');

    /* ---------- Supabase client ---------- */
    let supabaseClient = null;
    let isConfigured = false;

    try {
      if (SUPABASE_URL.startsWith('http') && SUPABASE_ANON_KEY.length > 20) {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        isConfigured = true;
      }
    } catch (err) {
      console.error('Supabase init failed:', err);
    }

    /* ---------- UI helpers ---------- */
    function showStatus(message, type) {
      statusBox.textContent = message;
      statusBox.className = 'status visible ' + type;
    }

    function hideStatus() {
      statusBox.className = 'status';
      statusBox.textContent = '';
    }

    function setButtonLoading(label) {
      checkinBtn.disabled = true;
      nameInput.disabled = true;
      destinationInput.disabled = true;
      btnText.textContent = label;
      if (!checkinBtn.querySelector('.spinner')) {
        const spinner = document.createElement('span');
        spinner.className = 'spinner';
        checkinBtn.prepend(spinner);
      }
    }

    function setButtonIdle(label) {
      const spinner = checkinBtn.querySelector('.spinner');
      if (spinner) spinner.remove();
      btnText.textContent = label || 'تسجيل حضور أو تسجيل انصراف';
      checkinBtn.disabled = false;
      nameInput.disabled = false;
      destinationInput.disabled = false;
    }

    /* ---------- GPS location ---------- */
    function getCurrentLocation() {
      return new Promise(function (resolve, reject) {
        if (!navigator.geolocation) {
          reject({ code: 2 });
          return;
        }
        navigator.geolocation.getCurrentPosition(resolve, reject, {
          enableHighAccuracy: true,
          timeout: 15000,
          maximumAge: 0
        });
      });
    }

    function geolocationErrorMessage(error) {
      switch (error && error.code) {
        case 1: return '❌ لازم تسمح بالوصول لموقعك من إعدادات المتصفح';
        case 2: return '❌ تعذر تحديد موقعك، تأكد من تشغيل GPS';
        case 3: return '❌ انتهت مهلة تحديد الموقع، حاول تاني';
        default: return '❌ تعذر تحديد موقعك، تأكد من تشغيل GPS';
      }
    }

    /* ---------- Reverse geocoding ---------- */
    const GOOGLE_MAPS_API_KEY = '';

    async function tryGoogleMaps(lat, lng) {
      if (!GOOGLE_MAPS_API_KEY) return null;
      try {
        const url = 'https://maps.googleapis.com/maps/api/geocode/json' +
                    '?latlng=' + lat + ',' + lng +
                    '&language=ar&key=' + GOOGLE_MAPS_API_KEY;
        const res = await fetch(url);
        if (!res.ok) return null;
        const data = await res.json();
        if (!data.results || !data.results[0]) return null;
        const result = data.results[0];
        const components = result.address_components || [];
        const get = (type) => {
          const c = components.find(comp => comp.types.includes(type));
          return c ? c.long_name : '';
        };
        return {
          governorate: get('administrative_area_level_1'),
          city: get('administrative_area_level_2') || get('locality'),
          street: get('route') || get('street_address') || '',
          fullAddress: result.formatted_address || ''
        };
      } catch (err) {
        console.warn('Google Maps geocoding failed:', err);
        return null;
      }
    }

    async function tryPhoton(lat, lng) {
      try {
        const url = 'https://photon.komoot.io/reverse?lat=' + lat + '&lon=' + lng + '&lang=ar';
        const res = await fetch(url);
        if (!res.ok) return null;
        const data = await res.json();
        const feature = data.features && data.features[0];
        if (!feature) return null;
        const props = feature.properties || {};
        const governorate = props.state || props.county || '';
        const city = props.city || props.district || props.locality || '';
        const street = props.street || props.name || '';
        const fullAddress = [street, city, governorate].filter(Boolean).join(' - ');
        return { governorate, city, street, fullAddress };
      } catch (err) {
        console.warn('Photon geocoding failed:', err);
        return null;
      }
    }

    async function tryNominatim(lat, lng) {
      try {
        const url = 'https://nominatim.openstreetmap.org/reverse' +
                    '?lat=' + lat + '&lon=' + lng +
                    '&format=jsonv2&accept-language=ar&addressdetails=1&zoom=18';
        const res = await fetch(url, {
          headers: { 'Accept': 'application/json', 'User-Agent': 'AttendanceApp/1.0' }
        });
        if (!res.ok) return null;
        const data = await res.json();
        const addr = data.address || {};
        const governorate = addr.state || addr.province || addr.region || addr.county || '';
        const city = addr.city || addr.town || addr.village ||
                     addr.suburb || addr.city_district || addr.neighbourhood || '';
        const street = addr.road || addr.pedestrian || addr.footway ||
                       addr.neighbourhood || addr.suburb || '';
        const fullAddress = [street, city, governorate].filter(Boolean).join(' - ');
        return { governorate, city, street, fullAddress };
      } catch (err) {
        console.warn('Nominatim geocoding failed:', err);
        return null;
      }
    }

    async function reverseGeocode(lat, lng) {
      const empty = { governorate: '', city: '', street: '', fullAddress: '' };

      const google = await tryGoogleMaps(lat, lng);
      if (google && google.street && google.city) return google;

      const photon = await tryPhoton(lat, lng);
      const nominatim = await tryNominatim(lat, lng);

      const merged = {
        governorate: (google && google.governorate) || (nominatim && nominatim.governorate) || (photon && photon.governorate) || '',
        city:        (google && google.city)        || (nominatim && nominatim.city)        || (photon && photon.city)        || '',
        street:      (google && google.street)      || (nominatim && nominatim.street)      || (photon && photon.street)      || '',
        fullAddress: (google && google.fullAddress) || (photon && photon.fullAddress)       || (nominatim && nominatim.fullAddress) || ''
      };

      if (!merged.street && !merged.city && !merged.governorate) return empty;
      return merged;
    }

    /* ---------- Cooldown ---------- */
    let cooldownTimer = null;

    function startCooldown() {
      let remaining = COOLDOWN_SECONDS;
      checkinBtn.disabled = true;
      btnText.textContent = 'يمكنك التسجيل مرة أخرى بعد ' + remaining + ' ثانية';

      cooldownTimer = setInterval(function () {
        remaining -= 1;
        if (remaining <= 0) {
          clearInterval(cooldownTimer);
          cooldownTimer = null;
          setButtonIdle('تسجيل حضور أو تسجيل انصراف');
          return;
        }
        btnText.textContent = 'يمكنك التسجيل مرة أخرى بعد ' + remaining + ' ثانية';
      }, 1000);
    }

    /* ---------- Main flow ---------- */
    async function handleCheckIn() {
      hideStatus();

      // Step 1 — validate name
      const name = nameInput.value.trim();
      if (!name) {
        showStatus('❌ من فضلك اكتب اسمك', 'error');
        nameInput.focus();
        return;
      }

      // Step 2 — validate destination
      const destination = destinationInput.value.trim();
      if (!destination) {
        showStatus('❌ من فضلك اكتب وجهتك', 'error');
        destinationInput.focus();
        return;
      }

      if (!isConfigured) {
        showStatus('❌ حصل خطأ، حاول تاني', 'error');
        console.error('Supabase is not configured.');
        return;
      }

      // Step 3 — get GPS
      setButtonLoading('جاري تحديد موقعك...');

      let position;
      try {
        position = await getCurrentLocation();
      } catch (error) {
        showStatus(geolocationErrorMessage(error), 'error');
        setButtonIdle('تسجيل حضور أو تسجيل انصراف');
        return;
      }

      const lat = position.coords.latitude;
      const lng = position.coords.longitude;

      // Step 4 — reverse geocode
      setButtonLoading('جاري الإرسال...');
      const address = await reverseGeocode(lat, lng);

      // Step 5 — send to Supabase
      try {
        const { data, error } = await supabaseClient.rpc('record_attendance', {
          p_name: name,
          p_lat: lat,
          p_lng: lng,
          p_governorate: address.governorate,
          p_city: address.city,
          p_street: address.street,
          p_full_address: address.fullAddress,
          p_destination: destination
        });

        if (error) throw error;

        const checkType = data && data.check_type;
        const successMessage = checkType === 'in'
          ? '✅ تم تسجيل حضورك بنجاح يا ' + name
          : '✅ تم تسجيل انصرافك بنجاح يا ' + name;

        showStatus(successMessage, 'success');
        nameInput.value = '';
        destinationInput.value = '';
        setButtonIdle('تسجيل حضور أو تسجيل انصراف');
        startCooldown();
      } catch (err) {
        console.error('Insert failed:', err);
        showStatus('❌ حصل خطأ، حاول تاني', 'error');
        setButtonIdle('تسجيل حضور أو تسجيل انصراف');
      }
    }

    /* ---------- Events ---------- */
    checkinBtn.addEventListener('click', handleCheckIn);

    nameInput.addEventListener('keydown', function (event) {
      if (event.key === 'Enter' && !checkinBtn.disabled) {
        event.preventDefault();
        destinationInput.focus();
      }
    });

    destinationInput.addEventListener('keydown', function (event) {
      if (event.key === 'Enter' && !checkinBtn.disabled) {
        handleCheckIn();
      }
    });

    nameInput.addEventListener('input', function () {
      if (statusBox.classList.contains('error')) hideStatus();
    });
    destinationInput.addEventListener('input', function () {
      if (statusBox.classList.contains('error')) hideStatus();
    });
  })();
  </script>
</body>
</html>
